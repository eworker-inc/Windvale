<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="./" />
    <meta name="description" content="Compile, verify, and run Windvale programs locally in your browser." />
    <meta name="theme-color" content="#101411" />
    <link rel="icon" type="image/png" href="assets/windvale-mark-transparent.png" />
    <script type="module" src="/analytics.js"></script>
    <script src="js/theme-bootstrap.js"></script>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="editor/playground-editor.css" />
    <title>Windvale Playground</title>
</head>
<body>
    <div id="app">
        <div class="boot-screen">
            <span class="boot-mark"><img src="assets/windvale-mark-transparent.png" alt="" /></span>
            <p>Loading the Windvale toolchain…</p>
        </div>
    </div>
    <div id="blazor-error-ui">
        The playground encountered an unexpected browser error.
        <a href="." class="reload">Reload</a>
        <button class="dismiss" type="button">×</button>
    </div>
    <script src="_framework/blazor.webassembly.js?v=__WINDVALE_BUILD_VERSION__" autostart="false"></script>
    <script src="js/playground-bootstrap.js?v=__WINDVALE_BUILD_VERSION__"></script>
</body>
</html>
