name: Verify native hosted packaging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-hosted-packaging:
    name: Windows native hosted packaging
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify native hosted packaging
        shell: cmd
        run: Tools\Native\Test-Hosted-Wvb-Packaging.cmd

      - name: Verify segmented compiler packaging
        shell: cmd
        run: Tools\Native\Test-Segmented-Compiler-Packaging.cmd

      - name: Reconstruct current Windows lowerer candidate
        shell: cmd
        run: |
          mkdir "%RUNNER_TEMP%\windvale-current-lowerer"
          call Tools\Native\Build-Wvb.cmd Windvale-Native-X64-Lowering-Tool.wvproj "%RUNNER_TEMP%\windvale-current-lowerer\Wvb-To-Wvo.wvb"
          call Tools\Native\Package-Segmented-Compiler-Wvb.cmd 6 "%RUNNER_TEMP%\windvale-current-lowerer\Wvb-To-Wvo.wvb" "%RUNNER_TEMP%\windvale-current-lowerer\Wvb-To-Wvo.exe"

      - name: Export current Windows lowerer candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: current-wvb-to-wvo-windows-${{ github.sha }}
          path: ${{ runner.temp }}\windvale-current-lowerer\*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  linux-hosted-packaging:
    name: Linux native hosted packaging
    runs-on: ubuntu-latest
    container:
      image: debian:12-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818
    timeout-minutes: 5
    steps:
      - name: Prepare Debian host
        shell: bash
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify native hosted packaging
        shell: bash
        run: ./Tools/Native/Test-Hosted-Wvb-Packaging.sh

      - name: Verify segmented compiler packaging
        shell: bash
        run: ./Tools/Native/Test-Segmented-Compiler-Packaging.sh

      - name: Reconstruct current Linux lowerer candidate
        shell: bash
        run: |
          mkdir -p -- "$RUNNER_TEMP/windvale-current-lowerer"
          ./Tools/Native/Build-Wvb.sh Windvale-Native-X64-Lowering-Tool.wvproj "$RUNNER_TEMP/windvale-current-lowerer/Wvb-To-Wvo.wvb"
          ./Tools/Native/Package-Segmented-Compiler-Wvb.sh 6 "$RUNNER_TEMP/windvale-current-lowerer/Wvb-To-Wvo.wvb" "$RUNNER_TEMP/windvale-current-lowerer/Wvb-To-Wvo.elf"

      - name: Export current Linux lowerer candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: current-wvb-to-wvo-linux-${{ github.sha }}
          path: ${{ runner.temp }}/windvale-current-lowerer/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
