name: Deploy playground

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-playground.yml
      - Compiler/Reference/**
      - Object-Model/Windvale.ObjectModel/**
      - Runtime/Windvale.Bytecode/**
      - Runtime/Windvale.Runtime/**
      - Tools/Windvale.Playground.Engine/**
      - Tools/Windvale.Playground/**
      - Directory.Build.props
      - global.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    name: Build static playground
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Publish standalone WebAssembly application
        run: >-
          dotnet publish Tools/Windvale.Playground/Windvale.Playground.csproj
          --configuration Release
          --output artifacts/playground
          -p:ContinuousIntegrationBuild=true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: artifacts/playground/wwwroot

  deploy:
    name: Publish playground
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
