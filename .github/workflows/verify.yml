name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  classify-changes:
    name: Classify verification scope
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      editor: ${{ steps.classify.outputs.editor }}
      homepage: ${{ steps.classify.outputs.homepage }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
      head_sha: ${{ steps.classify.outputs.head_sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $Arguments = @{
            GitHubOutputPath = $env:GITHUB_OUTPUT
          }
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $Arguments.ForceQualification = $true
          } elseif ($env:EVENT_NAME -eq 'pull_request') {
            $Arguments.BaseReference = $env:PULL_REQUEST_BASE_SHA
            $Arguments.HeadReference = $env:PULL_REQUEST_HEAD_SHA
          } else {
            $Arguments.BaseReference = $env:PUSH_BASE_SHA
            $Arguments.HeadReference = $env:GITHUB_SHA
          }
          ./Tools/Verify/Classify-Verification-Changes.ps1 @Arguments

      - name: Verify change classification rules
        shell: pwsh
        run: |
          if ('${{ steps.classify.outputs.scope }}' -notin @('lightweight', 'website', 'qualification')) {
            throw 'Verification scope classification failed.'
          }
          if ('${{ steps.classify.outputs.editor }}' -notin @('true', 'false')) {
            throw 'Editor verification classification failed.'
          }
          if ('${{ steps.classify.outputs.homepage }}' -notin @('true', 'false')) {
            throw 'Homepage deployment classification failed.'
          }
          ./Tools/Verify/Verify-Change-Classification.ps1
          ./Tools/Verify/Verify-Verification-Plan.ps1

  lightweight-verifier:
    name: Lightweight verifier
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.scope == 'lightweight' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Windvale editor support
        if: ${{ needs.classify-changes.outputs.editor == 'true' }}
        shell: pwsh
        run: pwsh -NoProfile -File Tools/Editors/Verify-Windvale-Editor.ps1

      - name: Verify changed-file whitespace
        shell: pwsh
        env:
          BASE_SHA: ${{ needs.classify-changes.outputs.base_sha }}
          HEAD_SHA: ${{ needs.classify-changes.outputs.head_sha }}
        run: |
          git diff --check $env:BASE_SHA $env:HEAD_SHA --
          if ($LASTEXITCODE -ne 0) { throw 'Changed-file whitespace verification failed.' }

  website-verifier:
    name: Website verifier
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.scope == 'website' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Tools/Windvale.Playground/package-lock.json

      - name: Verify Windvale editor support
        if: ${{ needs.classify-changes.outputs.editor == 'true' }}
        shell: pwsh
        run: pwsh -NoProfile -File Tools/Editors/Verify-Windvale-Editor.ps1

      - name: Verify changed-file whitespace
        shell: pwsh
        env:
          BASE_SHA: ${{ needs.classify-changes.outputs.base_sha }}
          HEAD_SHA: ${{ needs.classify-changes.outputs.head_sha }}
        run: |
          git diff --check $env:BASE_SHA $env:HEAD_SHA --
          if ($LASTEXITCODE -ne 0) { throw 'Changed-file whitespace verification failed.' }

      - name: Verify website
        shell: pwsh
        run: pwsh -NoProfile -File Tools/Verify/Verify-Website.ps1

  windows-verifier:
    name: Windows verifier
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.scope == 'qualification' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned .NET SDK
        if: ${{ needs.classify-changes.outputs.scope == 'qualification' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify Windvale editor support
        if: ${{ needs.classify-changes.outputs.editor == 'true' }}
        shell: pwsh
        run: pwsh -NoProfile -File Tools/Editors/Verify-Windvale-Editor.ps1

      - name: Run Windows verification
        if: ${{ needs.classify-changes.outputs.scope == 'qualification' }}
        shell: pwsh
        run: pwsh -NoProfile -File Tools/Verify/Verify-Seed.ps1 -Level Qualification

  linux-verifier:
    name: Linux verifier
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.scope == 'qualification' }}
    runs-on: ubuntu-latest
    container:
      image: debian:12-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818
    timeout-minutes: 60
    steps:
      - name: Prepare Debian host
        shell: bash
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl git gzip libicu72 tar

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned .NET SDK
        if: ${{ needs.classify-changes.outputs.scope == 'qualification' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Run Linux verification
        if: ${{ needs.classify-changes.outputs.scope == 'qualification' }}
        shell: bash
        env:
          VERIFY_LEVEL: qualification
        run: ./Tools/Verify/Verify-Seed.sh

  verification-gate:
    name: Verification gate
    needs:
      - classify-changes
      - lightweight-verifier
      - website-verifier
      - windows-verifier
      - linux-verifier
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the selected verification path
        shell: bash
        env:
          SCOPE: ${{ needs.classify-changes.outputs.scope }}
          CLASSIFY_RESULT: ${{ needs.classify-changes.result }}
          LIGHTWEIGHT_RESULT: ${{ needs.lightweight-verifier.result }}
          WEBSITE_RESULT: ${{ needs.website-verifier.result }}
          WINDOWS_RESULT: ${{ needs.windows-verifier.result }}
          LINUX_RESULT: ${{ needs.linux-verifier.result }}
        run: |
          test "$CLASSIFY_RESULT" = success
          case "$SCOPE" in
            lightweight)
              test "$LIGHTWEIGHT_RESULT" = success
              test "$WEBSITE_RESULT" = skipped
              test "$WINDOWS_RESULT" = skipped
              test "$LINUX_RESULT" = skipped
              ;;
            website)
              test "$LIGHTWEIGHT_RESULT" = skipped
              test "$WEBSITE_RESULT" = success
              test "$WINDOWS_RESULT" = skipped
              test "$LINUX_RESULT" = skipped
              ;;
            qualification)
              test "$LIGHTWEIGHT_RESULT" = skipped
              test "$WEBSITE_RESULT" = skipped
              test "$WINDOWS_RESULT" = success
              test "$LINUX_RESULT" = success
              ;;
            *)
              echo "Unsupported verification scope: $SCOPE" >&2
              exit 1
              ;;
          esac

  homepage-deployer:
    name: Publish verified windvale.ca
    needs:
      - classify-changes
      - verification-gate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.classify-changes.outputs.homepage == 'true' && needs.verification-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install pinned Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Tools/Windvale.Playground/package-lock.json

      - name: Build local playground editor
        working-directory: Tools/Windvale.Playground
        run: |
          npm ci
          npm run build

      - name: Publish standalone WebAssembly application
        run: >-
          dotnet publish Tools/Windvale.Playground/Windvale.Playground.csproj
          --configuration Release
          --output artifacts/playground
          -p:ContinuousIntegrationBuild=true

      - name: Assemble versioned same-origin static site
        shell: bash
        run: |
          marker="__WINDVALE_BUILD_VERSION__"
          versioned_paths=(
            "artifacts/playground/wwwroot/index.html"
            "artifacts/playground/wwwroot/js/playground-bootstrap.js"
          )
          for versioned_path in "${versioned_paths[@]}"; do
            grep -Fq "$marker" "$versioned_path"
            sed -i "s/$marker/$GITHUB_SHA/g" "$versioned_path"
            if grep -Fq "$marker" "$versioned_path"; then
              echo "Playground bootstrap version marker remained in $versioned_path." >&2
              exit 1
            fi
          done
          mkdir -p artifacts/site/playground
          cp -a Website/. artifacts/site/
          cp -a artifacts/playground/wwwroot/. artifacts/site/playground/

      - name: Publish verified static site
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.118.0 pages deploy artifacts/site
          --project-name windvale-ca
          --branch main
          --commit-hash "${GITHUB_SHA}"
