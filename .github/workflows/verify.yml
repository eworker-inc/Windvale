name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'qualification' || 'automatic' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
  queue: single

jobs:
  classify-changes:
    name: Classify verification scope
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      editor: ${{ steps.classify.outputs.editor }}
      documentation: ${{ steps.classify.outputs.documentation }}
      windows_required: ${{ steps.host-scope.outputs.windows_required }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
      head_sha: ${{ steps.classify.outputs.head_sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $Arguments = @{
            GitHubOutputPath = $env:GITHUB_OUTPUT
          }
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $Arguments.ForceQualification = $true
          } elseif ($env:EVENT_NAME -eq 'pull_request') {
            $Arguments.BaseReference = $env:PULL_REQUEST_BASE_SHA
            $Arguments.HeadReference = $env:PULL_REQUEST_HEAD_SHA
          } else {
            $Arguments.BaseReference = $env:PUSH_BASE_SHA
            $Arguments.HeadReference = $env:GITHUB_SHA
          }
          ./Tools/Verify/Classify-Verification-Changes.ps1 @Arguments

      - name: Select automatic Windows host
        id: host-scope
        shell: pwsh
        env:
          SCOPE: ${{ steps.classify.outputs.scope }}
          BASE_SHA: ${{ steps.classify.outputs.base_sha }}
          HEAD_SHA: ${{ steps.classify.outputs.head_sha }}
        run: |
          $WindowsRequired = $false
          if ($env:SCOPE -eq 'development') {
            $ChangedPaths = @(
              git diff --name-only --no-renames --diff-filter=ACDMRTUXB `
                $env:BASE_SHA $env:HEAD_SHA --
            )
            if ($LASTEXITCODE -ne 0) {
              throw 'Git could not enumerate paths for Windows host selection.'
            }
            $WindowsRequired = @(
              $ChangedPaths | Where-Object {
                $_ -match '(?i)(?:^|[/_.-])(?:Windows|Win32)(?:$|[/_.-])' -or
                $_ -match '(?i)\.(?:cmd|bat|ps1|exe|dll|pdb)$'
              }
            ).Count -ne 0
          }
          "windows_required=$($WindowsRequired.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Install pinned Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Verify change classification rules
        shell: pwsh
        run: |
          if ('${{ steps.classify.outputs.scope }}' -notin @('lightweight', 'website', 'development', 'qualification')) {
            throw 'Verification scope classification failed.'
          }
          if ('${{ steps.classify.outputs.editor }}' -notin @('true', 'false')) {
            throw 'Editor verification classification failed.'
          }
          if ('${{ steps.classify.outputs.documentation }}' -notin @('true', 'false')) {
            throw 'Documentation verification classification failed.'
          }
          ./Tools/Verify/Verify-Change-Classification.ps1
          ./Tools/Verify/Verify-Verification-Plan.ps1

  linux-documentation:
    name: Linux documentation verification
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.documentation == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify documentation
        shell: pwsh
        run: pwsh -NoProfile -File Tools/Verify/Verify-Documentation.ps1

  lightweight-verifier:
    name: Lightweight verifier
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.scope == 'lightweight' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Windvale editor support
        if: ${{ needs.classify-changes.outputs.editor == 'true' }}
        shell: pwsh
        run: pwsh -NoProfile -File Tools/Editors/Verify-Windvale-Editor.ps1

      - name: Verify changed-file whitespace
        shell: pwsh
        env:
          BASE_SHA: ${{ needs.classify-changes.outputs.base_sha }}
          HEAD_SHA: ${{ needs.classify-changes.outputs.head_sha }}
        run: |
          git diff --check $env:BASE_SHA $env:HEAD_SHA --
          if ($LASTEXITCODE -ne 0) { throw 'Changed-file whitespace verification failed.' }

  website-verifier:
    name: Website verifier
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.scope == 'website' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            Website/package-lock.json
            Tools/Windvale.Playground/package-lock.json

      - name: Verify Windvale editor support
        if: ${{ needs.classify-changes.outputs.editor == 'true' }}
        shell: pwsh
        run: pwsh -NoProfile -File Tools/Editors/Verify-Windvale-Editor.ps1

      - name: Verify changed-file whitespace
        shell: pwsh
        env:
          BASE_SHA: ${{ needs.classify-changes.outputs.base_sha }}
          HEAD_SHA: ${{ needs.classify-changes.outputs.head_sha }}
        run: |
          git diff --check $env:BASE_SHA $env:HEAD_SHA --
          if ($LASTEXITCODE -ne 0) { throw 'Changed-file whitespace verification failed.' }

      - name: Verify website
        shell: pwsh
        run: pwsh -NoProfile -File Tools/Verify/Verify-Website.ps1

  windows-development:
    name: Windows focused development verification
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.scope == 'development' && needs.classify-changes.outputs.windows_required == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        continue-on-error: true
        with:
          node-version: 24

      - name: Restore native development checkpoints
        id: native-development-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/windvale-native-development-cache
          key: windvale-native-development-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            windvale-native-development-v1-${{ runner.os }}-

      - name: Run affected native owners
        shell: pwsh
        env:
          BASE_SHA: ${{ needs.classify-changes.outputs.base_sha }}
          HEAD_SHA: ${{ needs.classify-changes.outputs.head_sha }}
          WINDVALE_NATIVE_CACHE_ROOT: ${{ runner.temp }}/windvale-native-development-cache
          VERIFICATION_TIMING_REPORT: ${{ runner.temp }}/windvale-development-verification.json
        run: pwsh -NoProfile -File Tools/Verify/Verify-Changed.ps1 -BaseReference $env:BASE_SHA -HeadReference $env:HEAD_SHA -SkipDocumentationVerification -AllowIncompleteInfrastructure -PlanVerificationInClassification -GitHubVerificationOnLinux -TimingReportPath $env:VERIFICATION_TIMING_REPORT

      - name: Analyze bounded development timing history
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        env:
          WINDVALE_NATIVE_CACHE_ROOT: ${{ runner.temp }}/windvale-native-development-cache
          VERIFICATION_TIMING_REPORT: ${{ runner.temp }}/windvale-development-verification.json
          VERIFICATION_TIMING_HISTORY: ${{ runner.temp }}/windvale-native-development-cache/verification-timing-history.json
          VERIFICATION_TIMING_ANALYSIS: ${{ runner.temp }}/windvale-development-timing-analysis.json
        run: |
          $null = New-Item -ItemType Directory -Force -Path $env:WINDVALE_NATIVE_CACHE_ROOT
          pwsh -NoProfile -File Tools/Verify/Update-Verification-Timing-History.ps1 -InputPath $env:VERIFICATION_TIMING_REPORT -HistoryPath $env:VERIFICATION_TIMING_HISTORY -AnalysisPath $env:VERIFICATION_TIMING_ANALYSIS

      - name: Save native development checkpoints
        if: ${{ always() && steps.native-development-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/windvale-native-development-cache
          key: ${{ steps.native-development-cache.outputs.cache-primary-key }}

      - name: Upload development verification timing
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          name: native-development-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windvale-development-verification.json
            ${{ runner.temp }}/windvale-development-timing-analysis.json
          if-no-files-found: warn
          retention-days: 14

  linux-development:
    name: Linux focused development verification
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.scope == 'development' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        continue-on-error: true
        with:
          node-version: 24

      - name: Restore native development checkpoints
        id: native-development-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/windvale-native-development-cache
          key: windvale-native-development-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            windvale-native-development-v1-${{ runner.os }}-

      - name: Run affected native owners
        shell: pwsh
        env:
          BASE_SHA: ${{ needs.classify-changes.outputs.base_sha }}
          HEAD_SHA: ${{ needs.classify-changes.outputs.head_sha }}
          WINDVALE_NATIVE_CACHE_ROOT: ${{ runner.temp }}/windvale-native-development-cache
          VERIFICATION_TIMING_REPORT: ${{ runner.temp }}/windvale-development-verification.json
        run: pwsh -NoProfile -File Tools/Verify/Verify-Changed.ps1 -BaseReference $env:BASE_SHA -HeadReference $env:HEAD_SHA -SkipDocumentationVerification -AllowIncompleteInfrastructure -PlanVerificationInClassification -TimingReportPath $env:VERIFICATION_TIMING_REPORT

      - name: Analyze bounded development timing history
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        env:
          WINDVALE_NATIVE_CACHE_ROOT: ${{ runner.temp }}/windvale-native-development-cache
          VERIFICATION_TIMING_REPORT: ${{ runner.temp }}/windvale-development-verification.json
          VERIFICATION_TIMING_HISTORY: ${{ runner.temp }}/windvale-native-development-cache/verification-timing-history.json
          VERIFICATION_TIMING_ANALYSIS: ${{ runner.temp }}/windvale-development-timing-analysis.json
        run: |
          $null = New-Item -ItemType Directory -Force -Path $env:WINDVALE_NATIVE_CACHE_ROOT
          pwsh -NoProfile -File Tools/Verify/Update-Verification-Timing-History.ps1 -InputPath $env:VERIFICATION_TIMING_REPORT -HistoryPath $env:VERIFICATION_TIMING_HISTORY -AnalysisPath $env:VERIFICATION_TIMING_ANALYSIS

      - name: Save native development checkpoints
        if: ${{ always() && steps.native-development-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/windvale-native-development-cache
          key: ${{ steps.native-development-cache.outputs.cache-primary-key }}

      - name: Upload development verification timing
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          name: native-development-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windvale-development-verification.json
            ${{ runner.temp }}/windvale-development-timing-analysis.json
          if-no-files-found: warn
          retention-days: 14

  windows-native-suite:
    name: Windows native qualification (${{ matrix.shard }}/4)
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.scope == 'qualification' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Verify Windvale editor support
        if: ${{ needs.classify-changes.outputs.editor == 'true' }}
        shell: pwsh
        run: pwsh -NoProfile -File Tools/Editors/Verify-Windvale-Editor.ps1

      - name: Verify changed-file whitespace
        shell: pwsh
        env:
          BASE_SHA: ${{ needs.classify-changes.outputs.base_sha }}
          HEAD_SHA: ${{ needs.classify-changes.outputs.head_sha }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BASE_SHA) -or
              [string]::IsNullOrWhiteSpace($env:HEAD_SHA)) {
            git diff --check HEAD^ HEAD --
          } else {
            git diff --check $env:BASE_SHA $env:HEAD_SHA --
          }
          if ($LASTEXITCODE -ne 0) { throw 'Changed-file whitespace verification failed.' }

      - name: Run native qualification shard
        shell: pwsh
        env:
          VERIFICATION_RESULT: ${{ runner.temp }}/windvale-native-qualification.json
        run: pwsh -NoProfile -File Tools/Verify/Invoke-WindvaleTests.ps1 -Shard ${{ matrix.shard }} -AllowLongRun -ResultPath $env:VERIFICATION_RESULT

      - name: Upload native qualification result
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-qualification-${{ runner.os }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/windvale-native-qualification.json
          if-no-files-found: warn
          retention-days: 30

  linux-native-suite:
    name: Linux native qualification (${{ matrix.shard }}/4)
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.scope == 'qualification' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    container:
      image: debian:12-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818
    timeout-minutes: 180
    steps:
      - name: Prepare Debian host
        shell: bash
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl git gzip libgssapi-krb5-2 libicu72 libssl3 libstdc++6 libunwind8 libuuid1 tar xz-utils zlib1g
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          powershell_version=7.6.5
          powershell_archive="powershell-${powershell_version}-linux-x64.tar.gz"
          powershell_root=/opt/microsoft/powershell/7
          curl --fail --location --silent --show-error --retry 3 \
            --output "/tmp/${powershell_archive}" \
            "https://github.com/PowerShell/PowerShell/releases/download/v${powershell_version}/${powershell_archive}"
          echo "b34ab3b19acac1d3d4d0d3cfdb02acf62f457b0b6a962ff008132033f7566844  /tmp/${powershell_archive}" \
            | sha256sum --check --strict
          mkdir --parents "$powershell_root"
          tar --extract --gzip --file "/tmp/${powershell_archive}" --directory "$powershell_root"
          chmod 0755 "$powershell_root/pwsh"
          ln --symbolic "$powershell_root/pwsh" /usr/local/bin/pwsh
          rm --force "/tmp/${powershell_archive}"
          pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Run native qualification shard
        shell: pwsh
        env:
          VERIFICATION_RESULT: ${{ runner.temp }}/windvale-native-qualification.json
        run: pwsh -NoProfile -File Tools/Verify/Invoke-WindvaleTests.ps1 -Shard ${{ matrix.shard }} -AllowLongRun -ResultPath $env:VERIFICATION_RESULT

      - name: Upload native qualification result
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-qualification-${{ runner.os }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/windvale-native-qualification.json
          if-no-files-found: warn
          retention-days: 30

  windows-webassembly:
    name: Windows native WebAssembly
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.scope == 'qualification' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Run native WebAssembly verification
        shell: pwsh
        run: pwsh -NoProfile -File Tools/Verify/Verify-WebAssembly-Engine.ps1

  linux-webassembly:
    name: Linux native WebAssembly
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.scope == 'qualification' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Run native WebAssembly verification
        shell: pwsh
        run: pwsh -NoProfile -File Tools/Verify/Verify-WebAssembly-Engine.ps1

  windows-bootstrap:
    name: Windows native bootstrap
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.scope == 'qualification' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Verify native compiler convergence
        shell: cmd
        run: Tools\Verify\Verify-Bootstrap.cmd

  linux-bootstrap:
    name: Linux native bootstrap
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.scope == 'qualification' }}
    runs-on: ubuntu-latest
    container:
      image: debian:12-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818
    timeout-minutes: 45
    steps:
      - name: Prepare Debian host
        shell: bash
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git gzip libicu72 tar
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Verify native compiler convergence
        shell: bash
        run: ./Tools/Verify/Verify-Bootstrap.sh

  verification-gate:
    name: Verification gate
    needs:
      - classify-changes
      - linux-documentation
      - lightweight-verifier
      - website-verifier
      - windows-development
      - linux-development
      - windows-native-suite
      - linux-native-suite
      - windows-webassembly
      - linux-webassembly
      - windows-bootstrap
      - linux-bootstrap
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the selected verification path
        shell: bash
        env:
          SCOPE: ${{ needs.classify-changes.outputs.scope }}
          DOCUMENTATION: ${{ needs.classify-changes.outputs.documentation }}
          WINDOWS_REQUIRED: ${{ needs.classify-changes.outputs.windows_required }}
          CLASSIFY_RESULT: ${{ needs.classify-changes.result }}
          LINUX_DOCUMENTATION_RESULT: ${{ needs.linux-documentation.result }}
          LIGHTWEIGHT_RESULT: ${{ needs.lightweight-verifier.result }}
          WEBSITE_RESULT: ${{ needs.website-verifier.result }}
          WINDOWS_DEVELOPMENT_RESULT: ${{ needs.windows-development.result }}
          LINUX_DEVELOPMENT_RESULT: ${{ needs.linux-development.result }}
          WINDOWS_NATIVE_RESULT: ${{ needs.windows-native-suite.result }}
          LINUX_NATIVE_RESULT: ${{ needs.linux-native-suite.result }}
          WINDOWS_WEBASSEMBLY_RESULT: ${{ needs.windows-webassembly.result }}
          LINUX_WEBASSEMBLY_RESULT: ${{ needs.linux-webassembly.result }}
          WINDOWS_BOOTSTRAP_RESULT: ${{ needs.windows-bootstrap.result }}
          LINUX_BOOTSTRAP_RESULT: ${{ needs.linux-bootstrap.result }}
        run: |
          test "$CLASSIFY_RESULT" = success
          if [ "$DOCUMENTATION" = true ]; then
            test "$LINUX_DOCUMENTATION_RESULT" = success
          else
            test "$LINUX_DOCUMENTATION_RESULT" = skipped
          fi
          case "$SCOPE" in
            lightweight)
              test "$LIGHTWEIGHT_RESULT" = success
              test "$WEBSITE_RESULT" = skipped
              test "$WINDOWS_DEVELOPMENT_RESULT" = skipped
              test "$LINUX_DEVELOPMENT_RESULT" = skipped
              test "$WINDOWS_NATIVE_RESULT" = skipped
              test "$LINUX_NATIVE_RESULT" = skipped
              test "$WINDOWS_WEBASSEMBLY_RESULT" = skipped
              test "$LINUX_WEBASSEMBLY_RESULT" = skipped
              test "$WINDOWS_BOOTSTRAP_RESULT" = skipped
              test "$LINUX_BOOTSTRAP_RESULT" = skipped
              ;;
            website)
              test "$LIGHTWEIGHT_RESULT" = skipped
              test "$WEBSITE_RESULT" = success
              test "$WINDOWS_DEVELOPMENT_RESULT" = skipped
              test "$LINUX_DEVELOPMENT_RESULT" = skipped
              test "$WINDOWS_NATIVE_RESULT" = skipped
              test "$LINUX_NATIVE_RESULT" = skipped
              test "$WINDOWS_WEBASSEMBLY_RESULT" = skipped
              test "$LINUX_WEBASSEMBLY_RESULT" = skipped
              test "$WINDOWS_BOOTSTRAP_RESULT" = skipped
              test "$LINUX_BOOTSTRAP_RESULT" = skipped
              ;;
            development)
              test "$LIGHTWEIGHT_RESULT" = skipped
              test "$WEBSITE_RESULT" = skipped
              if [ "$WINDOWS_REQUIRED" = true ]; then
                test "$WINDOWS_DEVELOPMENT_RESULT" = success
              else
                test "$WINDOWS_DEVELOPMENT_RESULT" = skipped
              fi
              test "$LINUX_DEVELOPMENT_RESULT" = success
              test "$WINDOWS_NATIVE_RESULT" = skipped
              test "$LINUX_NATIVE_RESULT" = skipped
              test "$WINDOWS_WEBASSEMBLY_RESULT" = skipped
              test "$LINUX_WEBASSEMBLY_RESULT" = skipped
              test "$WINDOWS_BOOTSTRAP_RESULT" = skipped
              test "$LINUX_BOOTSTRAP_RESULT" = skipped
              ;;
            qualification)
              test "$LIGHTWEIGHT_RESULT" = skipped
              test "$WEBSITE_RESULT" = skipped
              test "$WINDOWS_DEVELOPMENT_RESULT" = skipped
              test "$LINUX_DEVELOPMENT_RESULT" = skipped
              test "$WINDOWS_NATIVE_RESULT" = success
              test "$LINUX_NATIVE_RESULT" = success
              test "$WINDOWS_WEBASSEMBLY_RESULT" = success
              test "$LINUX_WEBASSEMBLY_RESULT" = success
              test "$WINDOWS_BOOTSTRAP_RESULT" = success
              test "$LINUX_BOOTSTRAP_RESULT" = success
              ;;
            *)
              echo "Unsupported verification scope: $SCOPE" >&2
              exit 1
              ;;
          esac
