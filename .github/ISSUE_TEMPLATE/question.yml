name: Question
description: Ask about using, understanding, or contributing to Windvale.
title: "Question: "
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Explain what you are trying to understand or accomplish.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context already reviewed
      description: Link relevant specifications, decisions, README sections, issues, or commands already tried.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I did not include secrets, credentials, private data, or vulnerability details.
          required: true
